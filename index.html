<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Beijing Time</title>
</head>
<body>
    <pre id="t"></pre>
    <script>
        function u() {
            const d = new Date();
            const t = new Date(d.getTime() + 8*3600*1000);
            document.getElementById('t').textContent = t.toISOString().replace('T',' ').slice(0,19);
        }
        u();
        setInterval(u,1000);
    </script>
</body>
</html>
